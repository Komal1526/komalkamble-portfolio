<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="kk-title kk-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="kk-title">Komal Sunil Kamble</title>
  <desc id="kk-desc">Web Developer working with PHP, Laravel, CodeIgniter and JavaScript. Mumbai, India.</desc>
  <defs>
    <linearGradient id="kk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="kk-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C77B9B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="kk-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D"/>
    </linearGradient>
    <linearGradient id="kk-path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="1" stop-color="#C77B9B"/>
    </linearGradient>
    <pattern id="kk-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="kk-fade" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.35" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="kk-gridmask"><rect width="1200" height="340" fill="url(#kk-fade)"/></mask>
    <filter id="kk-glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="kk-clip"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <style>
    .kk-name{font-family:Georgia,'Times New Roman',serif;font-size:66px;font-weight:700;fill:#F8F0F3;letter-spacing:1px}
    .kk-role{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:25px;fill:#E5B5C7;letter-spacing:1.5px}
    .kk-loc{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:17px;fill:#C77B9B;letter-spacing:4px}
    @media (prefers-reduced-motion: no-preference){
      .kk-sheen{animation:kk-sweep 9s ease-in-out infinite alternate}
      .kk-orbit1{transform-origin:990px 170px;animation:kk-spin 40s linear infinite}
      .kk-orbit2{transform-origin:990px 170px;animation:kk-spin 60s linear infinite reverse}
      .kk-draw{stroke-dasharray:1400;animation:kk-draw 6s ease-in-out infinite alternate}
      .kk-underline{transform-origin:80px 218px;animation:kk-grow 3.5s ease-in-out infinite alternate}
      .kk-dot{animation:kk-pulse 3s ease-in-out infinite}
    }
    @keyframes kk-sweep{from{transform:translateX(-500px)}to{transform:translateX(900px)}}
    @keyframes kk-spin{to{transform:rotate(360deg)}}
    @keyframes kk-draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
    @keyframes kk-grow{from{transform:scaleX(0.55)}to{transform:scaleX(1)}}
    @keyframes kk-pulse{0%,100%{opacity:1}50%{opacity:0.35}}
  </style>

  <g clip-path="url(#kk-clip)">
    <rect width="1200" height="340" fill="url(#kk-bg)"/>
    <rect width="1200" height="340" fill="url(#kk-grid)" mask="url(#kk-gridmask)"/>
    <rect class="kk-sheen" x="0" y="0" width="500" height="340" fill="url(#kk-sheen)"/>

    <!-- restrained orbital geometry -->
    <g fill="none" stroke="#C77B9B" stroke-opacity="0.35" stroke-width="1">
      <circle cx="990" cy="170" r="120" stroke-opacity="0.18"/>
      <circle cx="990" cy="170" r="70" stroke-opacity="0.25"/>
      <g class="kk-orbit1">
        <ellipse cx="990" cy="170" rx="150" ry="52" transform="rotate(-24 990 170)"/>
        <circle class="kk-dot" cx="1140" cy="170" r="5" fill="#E5B5C7" stroke="none" transform="rotate(-24 990 170)"/>
      </g>
      <g class="kk-orbit2">
        <ellipse cx="990" cy="170" rx="100" ry="100" stroke-dasharray="3 8"/>
        <circle cx="990" cy="70" r="4" fill="#C77B9B" stroke="none"/>
      </g>
    </g>
    <circle cx="990" cy="170" r="9" fill="#701A3D" stroke="#E5B5C7" stroke-width="1.5" filter="url(#kk-glow)"/>

    <!-- animated flowing path (fully drawn when motion is off) -->
    <path class="kk-draw" d="M0 292 C 180 250, 300 320, 520 285 S 860 240, 1200 280" fill="none" stroke="url(#kk-path)" stroke-width="2" stroke-linecap="round" filter="url(#kk-glow)"/>

    <!-- text -->
    <text class="kk-name" x="80" y="150">Komal Sunil Kamble</text>
    <rect class="kk-underline" x="80" y="216" width="520" height="3" rx="1.5" fill="url(#kk-line)" filter="url(#kk-glow)"/>
    <text class="kk-role" x="80" y="262">Web Developer  ·  PHP  ·  Laravel  ·  CodeIgniter  ·  JavaScript</text>
    <text class="kk-loc" x="80" y="60">MUMBAI · INDIA</text>
  </g>
</svg>
