<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Thanks for visiting" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="kk-fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="kk-fline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D"/>
    </linearGradient>
    <filter id="kk-fglow" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .kk-ft{font-family:Georgia,'Times New Roman',serif;font-size:24px;fill:#E5B5C7;letter-spacing:2px}
    @media (prefers-reduced-motion: no-preference){
      .kk-fl{transform-origin:600px 40px;animation:kk-f 4s ease-in-out infinite alternate}
    }
    @keyframes kk-f{from{transform:scaleX(0.4)}to{transform:scaleX(1)}}
  </style>
  <rect width="1200" height="120" rx="14" fill="url(#kk-fbg)"/>
  <rect class="kk-fl" x="300" y="39" width="600" height="2" fill="url(#kk-fline)" filter="url(#kk-fglow)"/>
  <text class="kk-ft" x="600" y="86" text-anchor="middle">Thanks for visiting · Komal Sunil Kamble</text>
</svg>
